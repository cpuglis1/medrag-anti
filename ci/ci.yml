# GitHub Actions CI — PARKED HERE because it was pushed with an OAuth token lacking the
# `workflow` scope (GitHub rejects pushes that touch .github/workflows/ without it).
#
# To activate CI:
#   1) grant the scope once:   gh auth refresh -h github.com -s workflow
#   2) move this file into place:
#        mkdir -p .github/workflows
#        git mv ci/ci.yml .github/workflows/ci.yml
#        git commit -m "Enable CI" && git push
#
# Runs the offline test suite (26 tests) — no GPU, no weights, no dataset downloads.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # MLX/torch extras are deliberately NOT installed (mlx is Apple-Silicon only).
      - name: Install (core deps)
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyyaml pytest

      - name: Run offline test suite
        # pythonpath is set in pyproject [tool.pytest.ini_options]; no env juggling needed.
        run: pytest -q
